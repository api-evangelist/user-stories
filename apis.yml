aid: user-stories
name: User Stories
description: >-
  A curated collection of API user stories following agile methodology formats.
  User stories capture software requirements from the end-user perspective using
  the format "As a [user], I want [goal], so that [benefit]". This repository indexes
  user story patterns for API consumers and producers across product management,
  developer experience, integration design, and platform engineering contexts.
  Teams use these to align stakeholders, prioritize API features, track progress,
  and adapt to evolving requirements throughout the API lifecycle.
