name: User Stories
description: A tool or practice for capturing software requirements from an end-user
  perspective, typically following the format "As a [user], I want [goal], so that
  [benefit]". Teams use it to align stakeholders, track progress, and adapt to changing
  requirements throughout the project lifecycle.
